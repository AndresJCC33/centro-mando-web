name: Vigilante de precios
# Cuotas de Pinnacle y casas blandas (The Odds API) para las ligas elegidas; publica datos/precios.json.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "vacío = corrida normal; sondeo = ver créditos y casas; ligas = revisar ligas sin gastar créditos"
        default: ""
  schedule:
    - cron: "40 13 * * *"   # 9:40 am de Caracas, una vez al día (1 crédito por liga con partidos en 36 h + marcadores)
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi numpy pandas scipy pyarrow
      - name: Precios
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python herramientas/precios.py ${{ inputs.modo }}
      - name: Motores NCAAB, NHL y NFL (simulación; no gasta créditos)
        if: ${{ inputs.modo != 'sondeo' && inputs.modo != 'ligas' }}
        continue-on-error: true
        timeout-minutes: 15
        run: python herramientas/motores_eeuu.py
      - name: Publicar si cambió
        if: ${{ inputs.modo != 'sondeo' && inputs.modo != 'ligas' }}
        run: |
          git config user.name "centro-mando-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos
          if ! git diff --cached --quiet; then
            git commit -q -m "Precios al $(TZ=America/Caracas date '+%d-%b %H:%M')"
            OK=0; for i in 1 2 3 4; do git pull -q --rebase --autostash origin main && git push -q && OK=1 && break; sleep $((i * 5)); done; [ $OK = 1 ]
          fi
