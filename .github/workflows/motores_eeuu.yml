name: Motores EE. UU. y análisis por juego
# Vuelve a simular con los resultados nuevos (sin gastar créditos: usa las cuotas que ya bajó el vigilante)
# y califica los pronósticos de los juegos que terminaron.
on:
  workflow_dispatch:
  schedule:
    - cron: "47 13-23,0-2 * * *"   # cada hora de 9:47 am a 10:47 pm de Caracas (la NBA entra cuando corre su motor)
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  motores:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi numpy pandas scipy pyarrow
      - name: Simular NCAAB, NHL y NFL
        continue-on-error: true
        run: python herramientas/motores_eeuu.py
      - name: Análisis a fondo por juego (NFL, NBA, fútbol)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python herramientas/analisis_juego.py
      - name: Publicar si cambió
        run: |
          git config user.name "centro-mando-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull -q --rebase origin main || true
          git add datos
          git diff --cached --quiet || (git commit -m "Motores EE. UU. al $(TZ=America/Caracas date '+%d-%b %H:%M')" && git push)
