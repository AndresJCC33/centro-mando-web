name: Motores EE. UU. y análisis por juego
# Vuelve a simular con los resultados nuevos (sin gastar créditos: usa las cuotas que ya bajó el vigilante)
# y califica los pronósticos de los juegos que terminaron.
on:
  workflow_dispatch:
  schedule:
    - cron: "55 13-23,0-2 * * *"   # cada hora de 9:55 am a 10:55 pm de Caracas, después de «actualizar» (:42), que trae la vitrina con la NBA
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  motores:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi numpy pandas scipy pyarrow
      - name: Simular NCAAB, NHL y NFL
        continue-on-error: true
        run: python herramientas/motores_eeuu.py
      - name: Análisis a fondo por juego (NFL, NBA, fútbol)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python herramientas/analisis_juego.py
      - name: Publicar si cambió
        run: |
          git config user.name "centro-mando-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos
          if ! git diff --cached --quiet; then
            git commit -q -m "Motores EE. UU. al $(TZ=America/Caracas date '+%d-%b %H:%M')"
            OK=0; for i in 1 2 3 4; do git pull -q --rebase --autostash origin main && git push -q && OK=1 && break; sleep $((i * 5)); done; [ $OK = 1 ]
          fi
