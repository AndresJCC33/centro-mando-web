name: Actualizar datos de la página
# Baja lo último del hub (Drive) y las tablas de posiciones, y publica si algo cambió.
on:
  workflow_dispatch:
  schedule:
    - cron: "12,42 * * * *"
concurrency:
  group: actualizar
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - name: Bajar datos
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python herramientas/actualizar.py
      - name: Publicar si cambió
        if: always()
        run: |
          git config user.name "centro-mando-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos
          if ! git diff --cached --quiet; then
            git commit -q -m "Datos al $(TZ=America/Caracas date '+%d-%b %H:%M')"
            OK=0; for i in 1 2 3 4; do git pull -q --rebase --autostash origin main && git push -q && OK=1 && break; sleep $((i * 5)); done; [ $OK = 1 ]
          fi
